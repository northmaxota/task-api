version: "3.9"

services:
  app:
    build: .
    container_name: task-api-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_DSN: "postgres://taskuser:taskpass@db:5432/taskdb?sslmode=disable"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: task-api-db
    restart: always
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
